<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/styles/general.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>

    <style>
      .main-content {
        margin: auto;
        width: 90%;
      }

      .top-user-bar {
        margin-top: 30px;
        width: 100vw;
      }

      .content-row {
        display: flex;
        margin: auto;

        width: 90%;

        align-content: center;
        align-items: center;
        align-self: center;
      }

      .content-row a {
        color: black;

        font-size: 20pt;
        font-weight: bold;
        text-decoration: none;
      }

      .cr-user {
        margin-left: auto;
        right: 0;
      }

      .cblink {
        text-decoration: none;
        color: black;
      }

      .config-box {
        margin-top: 20px;
      }
      .config-box h3 {
        margin: 0;
        font-size: 18pt;
      }

      .config-box p {
        margin: 0;
      }

      .iconplustitle {
        display: flex;
        
        align-items: center;
        align-content: center;
        align-self: center;
      }

      .icp-icon {
        margin-right: 10px;
      }

      .point-entry {
        margin-bottom: 30px;
      }
      .point-entry h3 {
        margin: 0;
      }

      .point-entry p {
        margin: 0;
      }

      .time-inputs-flex {
        display: flex;
      }

      .time-inputs-flex div {
        margin-right: 7px;
      }

      .point-form input[type="time"] {
        border-style: solid;
        border-radius: 2px;
        border-width: 1px;
        border-color: black;
        background-color: rgb(0, 0, 0, 0.06);
      }

      .checklabel-flex {
        display: flex;
      }

      .checklabel-flex div {
        margin-right: 5px;
      }
    </style>
  </head>

  <body>
    <div class="top-user-bar">
      <div class="content-row">
        <div class="cr-menu">
          <a href="#">☰</a>
        </div>

        <div class="cr-user">
          <a href="#">
            <img src="/images/icons/user.png" height="40" width="40">
          </a>
        </div>
      </div>
    </div>

    <div class="main-content">
      <h1>Sugerir criação de um novo ponto</h1>

      <div class="point-name">
        <h2>Ponto sem numeração</h2>
      </div>

      <div class="point-form">
        <div class="point-entry point-address">
          <h3>Endereço</h3>
          
          <input type="text">
        </div>

        <div class="point-entry point-time">
          <h3>Horário de operação</h3>

          <div class="time-inputs-flex">
            <div>
              <input type="time">
            </div>

            <div>
              —
            </div>

            <div>
              <input type="time">
            </div>
          </div>
        </div>

        <div class="point-entry point-types">
          <h3>Materiais Aceitos</h3>
          
          <div class="checklabel-flex">
            <div>
              <input type="checkbox">
            </div>

            <div>
              <p>PAPEL</p>
            </div>
          </div>

          <div class="checklabel-flex">
            <div>
              <input type="checkbox">
            </div>

            <div>
              <p>METAIS</p>
            </div>
          </div>

          <div class="checklabel-flex">
            <div>
              <input type="checkbox">
            </div>

            <div>
              <p>ORGÂNICOS</p>
            </div>
          </div>

          <div class="checklabel-flex">
            <div>
              <input type="checkbox">
            </div>

            <div>
              <p>BIOLÓGICOS</p>
            </div>
          </div>
        </div>

        <input type="submit" value="Enviar sugestão">
      </div>
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
</html>
