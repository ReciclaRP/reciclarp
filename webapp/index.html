<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>
  
    <style>
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        src: url(/fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-VariableFont_wght.ttf);
      }


      body {
        margin: 0;
        
        background-image: url("/images/background.png");
        font-family: "Atkinson Hyperlegible Next";
      }

      .main-content {
        margin: auto;
      }
      
      .login-page-content {
        margin-top: 20vh;
      }

      .logo {
        text-align: center;
      }

      .logo img {
        object-fit: contain;
      }
  
      .loginsection {
        align-content: center;
        align-items: center;
        justify-content: center;

        text-align: center;
      }

      .loginsection h3 {
        margin: 0;
        margin-bottom: 5px;
        margin-top: 20px;
      }

      #id-verif-inputs {
        display: none;
      }

      .verif-inputs .advice-text {
        width: 200px;
        margin: auto;
      }

      .loginsection input[type="email"],input[type="text"] {
        border-style: solid;
        border-radius: 8px;
        border-width: 1px;
        border-color: black;
        padding: 10px 10px 10px 10px;
        background-color: rgb(0, 0, 0, 0.06);
      }

      .loginsection input[type="submit"] {
        margin-top: 10px;
        padding: 10px 10px 10px 10px;
        
        border-radius: 6px;
        border-style: solid;
        border-color: rgba(0, 0, 0, 0.138);
        border-width: 1px;

        background-color: rgba(104, 104, 200, 0.8);
        color: white;

        font-weight: bold;

        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.412);
      }
    </style>
  </head>

  <body>
    <div class="main-content">
      <div class="login-page-content">
        <div class="logo">
          <img src="/images/logo.png">
        </div>

        <div class="loginsection">
          <div class="login-inputs">
            <h3>Login e Registro</h3>
            <input type="email" id="login-email">
          </div>

          <div class="verif-inputs" id="id-verif-inputs">
            <h3>Código de Verificação</h3>
            <input type="text" class="login-verif">
            
            <div class="advice-text">
              <p><small>Um código de verificação foi encaminhado ao seu e-mail.</small></p>
            </div>
          </div>

          <input type="submit" onclick="okPressed()">
        </div>
      </div>
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
  <script type="text/javascript" src="/src/main.js"></script>
</html>
