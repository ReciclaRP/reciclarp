<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/styles/general.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>
  </head>

  <body>
    <div class="main-content">
      <div class="login-page-content">
        <div class="logo">
          <img src="/images/logo.png">
        </div>

        <div class="loginsection">
          <div class="login-inputs">
            <h3>Login e Registro</h3>
            <input type="email" id="login-email">
          </div>

          <div class="verif-inputs" id="id-verif-inputs">
            <h3>Código de Verificação</h3>
            <input type="text" class="login-verif" id="login-code">
            
            <div class="advice-text">
              <p><small>Um código de verificação foi encaminhado ao seu e-mail.</small></p>
            </div>

            <input type="submit" id="login-button" onclick="loginWithCode()">
          </div>

          <input type="submit" id="send-code-button" onclick="okPressed()">
        </div>
      </div>
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
  <script type="text/javascript" src="/src/index.html.js"></script>
</html>
