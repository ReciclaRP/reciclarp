<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/styles/general.css">
    <link rel="stylesheet" href="/styles/mappage.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>

    <style>
      .popup-div {
        position: absolute;
        z-index: 999999999;

        background-color: white;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        border-radius: 8px;

        padding: 5px 10px 5px 10px;
      }

      .popup-div h3,p {
        margin: 0;
        padding: 0;
      }

      .popup-nametime {
        display: flex;
        align-content: center;
        align-items: center;

        margin-bottom: 10px;
      }

      .popup-nametime div {
        margin-left: 5px;
        margin-right: 5px;
      }

      .popup-address,.popup-kinds {
        margin-left: 5px;
        margin-right: 5px;
      }

      .button-options {
        display: flex;
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .button-options a {
        text-decoration: none;
      }

      .button-options div {
        margin-left: 5px;
        margin-right: 5px;
      }

      .maps-open-button {
        color: white;
        text-decoration: none;

        background-color: rgb(81, 81, 187);
        padding: 5px 10px 5px 10px;
        border-radius: 8px;

        box-shadow: rgba(0, 0, 0, 0.164) 5px 5px 10px;

        transition: 0.3s;
      }

      .maps-open-button:hover {
        background-color: white;
        color: rgb(81, 81, 187);
        border-color: rgb(81, 81, 187);

        border-width: 1px;
        border-style: solid;
        font-weight: bold;

        padding: 5px 15px 5px 15px;
      }
    </style>
  </head>

  <body>
    <div class="top-user-bar-blur"></div>
    <div class="top-user-bar">
      <div class="content-row">
        <div class="cr-menu">
          <a href="#">☰</a>
        </div>

        <div class="cr-user">
          <a href="#">
            <img src="/images/icons/user.png" height="50" width="50">
          </a>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="popup-div" id="location-popup">
        <div class="popup-content">
          <div class="popup-nametime">
            <div>
              <h3>Ponto nº XX</h3>
            </div>

            <div>
              ●
            </div>

            <div>
              <p>9:00 - 17:00</p>
            </div>

            <div>
              <p>Aberto</p>
            </div>
          </div>

          <div class="popup-address">
            <p>R. Alberto de Oliveira, 1988</p>
          </div>

          <div class="popup-kinds">
            <p>Ponto de reciclagem de: <span id="popup-kid-list">papel</span>.</p>
          </div>

          <div class="button-options">
            <div>
              <a href="#" class="maps-open-button">Abrir no Maps</a>
            </div>

            <div>
              <a href="#">Reportar Problema</a>
            </div>

            <div>
              <a href="#">Sugerir edição</a>
            </div>
          </div>
        </div>
      </div>

      <div class="map-div" id="map">

      </div>

      
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
  <script type="module" src="/src/map.js"></script>
</html>
