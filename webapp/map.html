<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/styles/general.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>

    <style>
      .map-div {
        width: 100vw;
        height: 100vh;
      }
    
      .top-user-bar-blur {
        width: 100vw;
        height: 15vh;

        background-color: white;

        position: absolute;

        z-index: 10000;

        margin-top: -5vh;

        filter: blur(5px);
      }

      .top-user-bar {
        width: 100vw;

        margin-top: -13vh;
        position: absolute;

        z-index: 10001;
      }

      .content-row {
        display: flex;
        width: 90%;
        margin: auto;

        padding-top: 150px;
        align-content: center;
        align-items: center;
        align-self: center;
      }

      .content-row a {
        color: black;

        font-size: 20pt;
        font-weight: bold;
        text-decoration: none;
      }

      .cr-user {
        margin-left: auto;
        right: 0;
      }
    </style>
  </head>

  <body>
    <div class="top-user-bar-blur"></div>
    <div class="top-user-bar">
      <div class="content-row">
        <div class="cr-menu">
          <a href="#">☰</a>
        </div>

        <div class="cr-user">
          <a href="#">Você</a>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="map-div" id="map">

      </div>
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
  <script type="module" src="/src/map.js"></script>
</html>
