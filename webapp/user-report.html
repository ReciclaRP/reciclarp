<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/styles/general.css">
    <link rel="stylesheet" href="/styles/topbar.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>ReciclaRP</title>

    <style>
      .point-name p {
        margin: 0;
      }

      .point-name-hour-flex {
        display: flex;

        align-items: center;
        align-content: center;
        align-self: center;
      }

      .point-name-hour-flex div {
        margin-right: 10px;
      }

      .point-title {
        font-size: 14pt;
        font-weight: bold;
      }

      .ruatal {
        font-style: italic;
      }

      .recpfor {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="top-user-bar">
      <div class="content-row">
        <div class="cr-menu">
          <a href="#">☰</a>
        </div>

        <div class="cr-user">
          <a href="#">
            <img src="/images/icons/user.png" height="40" width="40">
          </a>
        </div>
      </div>
    </div>

    <div class="main-content">
      <h1>Reportar um problema</h1>

      <div class="point-name">
        <div class="point-name-hour-flex">
          <div>
            <p class="point-title">Ponto nº XX</p>
          </div>

          <div>
            🞄
          </div>
          
          <div>
            <p><span id="tfrom">9:00</span> - <span id="tto">17:00</span></p>
          </div>
        </div>

        <div class="ruatal">
          <p id="raddr">R. Alberto de Oliveira, 1988</p>
        </div>
        
        <div class="recpfor">
          <p>Ponto de reciclagem de: <span id="itemnames">papel</span></p>
        </div>
      </div>

      <h2>Categoria do problema</h2>

      <select id="select-problemas" size="3">
        <option value="pointabsent">O ponto não existe</option>
        <option value="pointfull">O ponto está cheio/em manutenção</option>
        <option value="pointtime">O ponto não funciona no horário correto</option>
      </select>

      <h2>Descrição do problema</h2>

      <textarea class="report-description-box">

      </textarea>

      <div class="problemreportbutton">
        <input type="submit" value="Reportar Problema">
      </div>
    </div>
  </body>

  <!--seems like type="module" changes things / drops into node! -->
</html>
